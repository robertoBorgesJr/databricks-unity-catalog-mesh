resources:
  jobs:
    gold_dim_tempo_job:
      name: "gold_dim_tempo_${var.environment}"
      tasks:
        - task_key: dim_tempo
          existing_cluster_id: "${var.sales_cluster_id}"
          notebook_task:
            notebook_path: ../src/sales_domain/gold/gold_dim_tempo.py
            base_parameters:
              environment: "${var.environment}"
          libraries:
            - whl: ../dist/*.whl

