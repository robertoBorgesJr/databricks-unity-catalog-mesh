resources:
  jobs:
    gold_dim_campanha_job:
      name: "gold_dim_campanha_${var.environment}"
      tasks:
        - task_key: dim_campanha
          existing_cluster_id: "${var.marketing_cluster_id}"
          notebook_task:
            notebook_path: ../src/marketing_domain/gold/gold_dim_campanha.py
            base_parameters:
              environment: "${var.environment}"
          libraries:
            - whl: ../dist/*.whl

    gold_load_marketing_job:
      name: "gold_load_marketing_${var.environment}"
      tasks:
        - task_key: load_marketing
          existing_cluster_id: "${var.marketing_cluster_id}"
          notebook_task:
            notebook_path: ../src/marketing_domain/gold/gold_load_marketing.py
            base_parameters:
              environment: "${var.environment}"
          libraries:
            - whl: ../dist/*.whl